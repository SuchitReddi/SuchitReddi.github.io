<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recent Listens – ListenBrainz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/style.css">
</head>
<body class="listen-page">
  <main class="page-content">
  <button><a href="../">Back</a></button><br>
  <div class="listen-panel">
    <h1>
      🎧 Recent Listens (8 hours)
      <span class="badge">ListenBrainz</span>
    </h1>
    <div class="meta">
      User: <strong>anomika</strong> · Source: 
      <a href="https://listenbrainz.org/user/anomika/" target="_blank" rel="noopener">
        ListenBrainz profile
      </a>
    </div>
    <div id="status" class="status">Loading listens…</div>
    <ul id="listen-list" class="listen-list"></ul>
  </div>
  <button><a href="../">Back</a></button><br>
  </main>

  <script>
    // CONFIG – you can change this to another user or minutes if you like
    const FEED_URL = "https://listenbrainz.org/syndication-feed/user/anomika/listens?minutes=480";

    async function loadFeed() {
      const statusEl = document.getElementById("status");
      const listEl = document.getElementById("listen-list");

      try {
        const res = await fetch(FEED_URL);
        if (!res.ok) {
          throw new Error("HTTP " + res.status + " " + res.statusText);
        }

        const text = await res.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(text, "text/xml");

        // Atom feeds are namespaced
        const ATOM_NS = "http://www.w3.org/2005/Atom";
        const entries = xmlDoc.getElementsByTagNameNS(ATOM_NS, "entry");

        if (!entries.length) {
          statusEl.textContent = "No listens found in this time range.";
          return;
        }

        statusEl.textContent = ""; // Clear status

        // Clear existing items
        listEl.innerHTML = "";

        for (let i = 0; i < entries.length; i++) {
          const entry = entries[i];

          const titleEl = entry.getElementsByTagNameNS(ATOM_NS, "title")[0];
          const publishedEl = entry.getElementsByTagNameNS(ATOM_NS, "published")[0];
          const linkEl = entry.getElementsByTagNameNS(ATOM_NS, "link")[0];

          const title = titleEl ? titleEl.textContent : "Unknown track";
          const publishedRaw = publishedEl ? publishedEl.textContent : null;
          const linkHref = linkEl ? linkEl.getAttribute("href") : "#";

          let localTimeStr = "";
          if (publishedRaw) {
            const d = new Date(publishedRaw);
            if (!isNaN(d.getTime())) {
              localTimeStr = d.toLocaleString();
            } else {
              localTimeStr = publishedRaw;
            }
          }

          // In your example title is "Track - Artist"
          let trackName = title;
          let artistName = "";
          const parts = title.split(" - ");
          if (parts.length >= 2) {
            artistName = parts.pop();
            trackName = parts.join(" - ");
          }

          const li = document.createElement("li");
          li.className = "listen-item";

          li.innerHTML = `
            <div class="track-title">${escapeHtml(trackName)}</div>
            <div class="track-meta">
              ${artistName ? "by <strong>" + escapeHtml(artistName) + "</strong>" : ""}
              · <a href="${linkHref}" target="_blank" rel="noopener">View on ListenBrainz</a>
            </div>
            <div class="track-time">${localTimeStr ? "Listened at " + localTimeStr : ""}</div>
          `;

          listEl.appendChild(li);
        }

      } catch (err) {
        console.error(err);
        const statusEl = document.getElementById("status");
        statusEl.textContent = "Failed to load listens: " + err.message;
        statusEl.classList.add("error");
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadFeed();
  </script>
</body>
</html>
